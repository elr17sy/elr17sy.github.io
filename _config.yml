words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false
comments:
  provider               :
atom_feed:
  hide                   : true
  path                   :

google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

twitter:
  username               :
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 :
social:
  type                   : Person
  name                   : "Songjiang Yang"
  links:
    - "https://orcid.org/0000-0002-9052-9092"
    - "https://scholar.google.co.uk/citations?hl=en&user=ptrdlfMAAAAJ"
